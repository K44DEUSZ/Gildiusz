name: Sprawdzenie projektu
on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run cli -- validate
      - run: npm audit --audit-level=moderate
      - run: docker build -t gildiusz-check .
      - name: Przygotuj paczkę gałęzi test
        if: github.ref == 'refs/heads/test' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: node scripts/build-package.mjs "$RUNNER_TEMP/test-runtime-package"
      - name: Zachowaj testową paczkę
        if: github.ref == 'refs/heads/test' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gildiusz-test-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/test-runtime-package/gildiusz-linux-x64.tar.gz
            ${{ runner.temp }}/test-runtime-package/manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  hosting-package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/build-package.mjs "$RUNNER_TEMP/hosting-package"
      - run: node scripts/publish-build.mjs "$RUNNER_TEMP/hosting-package"
        env:
          GITHUB_TOKEN: ${{ github.token }}
